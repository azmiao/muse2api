name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and export image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: |
            muse2api:latest
            muse2api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/muse2api-${{ github.sha }}.tar
          provenance: false
          sbom: false

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          image_tar="${RUNNER_TEMP}/muse2api-${GITHUB_SHA}.tar"
          test -s "$image_tar"
          sha256sum "$image_tar" | tee "${image_tar}.sha256"
          docker load --input "$image_tar"
          docker image inspect "muse2api:${GITHUB_SHA}" >/dev/null

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muse2api-image-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/muse2api-${{ github.sha }}.tar
            ${{ runner.temp }}/muse2api-${{ github.sha }}.tar.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Log in to GitHub Container Registry
        id: ghcr-login
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish and verify GHCR image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker tag "muse2api:${GITHUB_SHA}" "${image}:${GITHUB_SHA}"
          docker push "${image}:${GITHUB_SHA}"
          docker buildx imagetools inspect "${image}:${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "muse2api:${GITHUB_SHA}" "${image}:latest"
            docker push "${image}:latest"
            docker buildx imagetools inspect "${image}:latest"
          fi
          {
            echo '## Docker image published'
            echo
            echo "- Commit image: \`${image}:${GITHUB_SHA}\`"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "- Latest image: \`${image}:latest\`"
            fi
            echo '- Platform: linux/amd64'
            echo '- Docker tar and SHA-256 checksum are available in workflow artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: ${{ always() && steps.ghcr-login.outcome == 'success' }}
        run: docker logout ghcr.io
